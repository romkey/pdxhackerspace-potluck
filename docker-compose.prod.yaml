# Production: runs the released image from ghcr.io. Configure it in .env
# next to this file (see .env.example and docs/configuration.md).
#
#   docker compose -f docker-compose.prod.yaml up -d
#   APP_VERSION=1.2.3 docker compose -f docker-compose.prod.yaml up -d   # pin a release
#   docker compose -f docker-compose.prod.yaml build   # build the image locally instead

services:
  migrate:
    image: ghcr.io/romkey/pdxhackerspace-potluck:${APP_VERSION:-latest}
    command: ["pdxhackerspace-potluck", "migrate"]
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/romkey/pdxhackerspace-potluck:${APP_VERSION:-latest}
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POTLUCK_DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      # Drop banner.png (etc.) here; it's picked up without a restart.
      - ./data:/data:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Least privilege: nothing to write but /tmp, no capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:18-trixie
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
